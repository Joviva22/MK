name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run lint

      - name: Pruebas unitarias (Node, sin Electron: ~0,3 s)
        run: npm run test:unit

      - name: Instalar Xvfb (Electron necesita un display real)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - run: xvfb-run -a npm test
      - run: xvfb-run -a npm run test:office-recovery
