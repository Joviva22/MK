<!doctype html>
<html>
<head><meta charset="utf-8" /><style>
  /* Mismos valores que el tema claro por defecto de styles.css: el shim usa
     estas variables (--accent, --text, --text-muted, --surface-2) para el
     resaltado de Markdown, y sin definirlas acá los checks de color no
     prueban nada real. */
  :root { --bg: #ffffff; --surface-2: #eef1f5; --text: #1f2937; --text-muted: #6b7280; --accent: #2563eb; }
  #editor-pane { width: 600px; height: 400px; border: 1px solid #ccc; }
</style></head>
<body>
<div id="editor-pane"></div>
<script src="../node_modules/marked/lib/marked.umd.js"></script>
<script src="../node_modules/dompurify/dist/purify.js"></script>
<script src="../node_modules/katex/dist/katex.min.js"></script>
<script src="cm6-bundle.js"></script>
<script src="cm6-shim.js"></script>
</body>
</html>
